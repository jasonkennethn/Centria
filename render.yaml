services:
  - type: web
    name: centria-enterprise-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "centria-enterprise.onrender.com,.onrender.com,localhost,127.0.0.1"
      - key: FRONTEND_URL
        value: "https://centria-enterprise.vercel.app"
